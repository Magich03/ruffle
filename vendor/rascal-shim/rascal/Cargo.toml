[package]
name = "rascal"
authors = ["Nathan Adams <dinnerbone@dinnerbone.com>"]
version = "0.3.5"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dinnerbone/Rascal"
keywords = ["actionscript", "flash", "swf"]
description = "A parser and compiler for Flash ActionScript 2 files into SWFs"
categories = ["compilers", "parser-implementations"]

[dependencies]
indexmap = { version = "2.14.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
annotate-snippets = "0.12.16"
byteorder = "1.5.0"
swf = "0.2.2"
winnow = "1.0.2"
log = "0.4.31"

[features]
default = []
winnow-debug = ["winnow/debug"]
